#Sharpshooter
#perk requirements removed: not necessary
#lvel 1 removed: to fit reworked tree style
NewPerks.Reflexes_Left_Milestone_3:
  perkWeaponGroup: None
  requiresPerks: []
  levels:
  - !remove NewPerks.Reflexes_Left_Milestone_3_inline0


#lvl1
# moved to Reflexes Milestone 1 as lvl 1

#lvl2
NewPerks.Reflexes_Left_Milestone_3_inline11.prereqRecord: Prereqs.RangedWeaponHeldPrereq

#lvl3
#Rework time
#original perk doesn't incentivise a reflexes playstyle (instead of using movement youre best of continuing to shoot) therefore
# if instead the main perk applied a stacking bleed, it would incentivise non-shooting actions
# then replace the crit stack with stamina stacks.
# potentially move the crit stacks to body with more stacks and a lower value.

#prereq
# NewPerks.Reflexes_Left_Milestone_3_inline24.conditions:
#   - !remove NewPerks.Reflexes_Left_Milestone_3_inline27



#let's swap this for a bleed on enemy
NewPerks.Reflexes_Left_Milestone_3_inline21:
  effectors:
    - $type: gamedataAddStatusEffectToAttackEffector_Record
      isRandom: False
      stacks: 1
      statusEffect: PerksApplyToMore.SharpshooterBleed
      effectorClassName: AddStatusEffectToAttackEffector
      prereqRecord: 
        $base: NewPerks.Reflexes_Left_Milestone_3_inline23
        nestedPrereqs:
          - !remove NewPerks.ReflexesWeaponTypePrereq
          - !append-once Prereqs.RangedWeaponHeldPrereq
      removeAfterActionCall: False
      removeAfterPrereqCheck: False
      statModifierGroups: []


# NewPerks.Reflexes_Left_Milestone_3_inline22:
#   applicationTarget: Target
#   count: 1
#   statusEffect: PerksApplyToMore.SharpshooterBleed

NewPerks.Reflexes_Left_Milestone_3_inline19:
  loc_desc_key: LocKey#PerksApplyToMore-Reflexes_Left_Milestone_3_Sharpshooter-LvL3-Desc
  uiData: 
    $type: gamedataNewPerkLevelUIData_Record
    floatValues:
      - 2 #duration
    intValues: 
      - 5 #num stacks


#define status effect:
PerksApplyToMore.SharpshooterBleed:
  $base: BaseStatusEffect.Bleeding
  duration: 
    $base: BaseStatusEffect.Bleeding_inline1
    statModifiers:
      - $type: gamedataConstantStatModifier_Record
        value: 3 # short duration forces to start shooting again soon rather than rely on DOT alone
        modifierType: Additive
        statType: BaseStats.MaxDuration
      - BaseStatusEffect.Bleeding_inline3 #duration increase per +bleed duration the player has 1 to 1
  maxStacks: 
    $type: gamedataStatModifierGroup_Record
    drawBasedOnStatType: False
    optimiseCombinedModifiers: False
    saveBasedOnStatType: False
    statModsLimit: -1
    relatedModifierGroups: []
    statModifiers:
      - $type: gamedataConstantStatModifier_Record
        value: 5 # stack count >1 to incentivise multi-hit weapons. Keep it low though to help most with semi auto/slow firing weapons
        modifierType: Additive
        statType: BaseStats.MaxStacks
  # replicated: True #not sure what this does, leaving it at vanilla for now
  # uiData: BaseStatusEffect.Bleeding_inline12 #unchanged for now
  # gameplayTags: #unchanged for now
  #   - Debuff
  #   - DoT
  packages:
    - $base: BaseStatusEffect.Bleeding_inline5
      effectors:
        - $base: BaseStatusEffect.Bleeding_inline8
          attackRecord:
            $base: Attacks.PhysicalDamageOverTime
            statModifiers:
              - !remove Attacks.PhysicalDamageOverTime_inline0
              - !append
                $type: gamedataConstantStatModifier_Record
                value: 0.02 #"very low" is at 0.01, base at 0.04. high 0.08. As we're stacking 5x and want this to be a STRONG bleed I assume 1-3% is best
                modifierType: Multiplier
                statType: BaseStats.PhysicalDamage
          delayTime: 0.5
          timeDilationDriver: Effectors.TDD_World
          effectorClassName: TriggerContinuousAttackEffector
          prereqRecord: Prereqs.AlwaysTruePrereq
          removeAfterActionCall: False
          removeAfterPrereqCheck: False
          statModifierGroups: []
      stats:
        - BaseStatusEffect.Bleeding_inline6 #speed reduction
        - BaseStatusEffect.Bleeding_inline7 #prevents enemy sprinting on regular enemies