

# Savage Sling
NewPerks.Body_Master_Perk_5:
  requiresPerks: []
  perkWeaponGroup: None
  levels:
  - PerksApplyToMore.Body_Master_Perk_5_NewLvL1
  - NewPerks.Body_Master_Perk_5_inline1



PerksApplyToMore.Body_Master_Perk_5_NewLvL1:
  $type: gamedataNewPerkLevelData_Record
  dataPackage: 
    $type: gamedataGameplayLogicPackage_Record
    stackable: False
    animationWrapperOverrides: []
    effectors:
      - $type: gamedataApplyStatGroupEffector_Record
        removeWithEffector: True
        statGroup: 
          $type: gamedataStatModifierGroup_Record
          drawBasedOnStatType: False
          optimiseCombinedModifiers: False
          saveBasedOnStatType: False
          statModsLimit: -1
          relatedModifierGroups: []
          statModifiers:
            - $type: gamedataConstantStatModifier_Record
              value: 0.2
              modifierType: Multiplier
              statType: BaseStats.KnockdownImpulseModifier #chance to knockdown
            - $type: gamedataConstantStatModifier_Record
              value: 0.2
              modifierType: Multiplier
              statType: BaseStats.PhysicalImpulseModifier #force pushed back
        effectorClassName: ApplyStatGroupEffector
        prereqRecord: Prereqs.AlwaysTruePrereq
        removeAfterActionCall: False
        removeAfterPrereqCheck: False
        statModifierGroups: []
    items: []
    statPools: []
    stats: []
  loc_desc_key: LocKey#PerksApplyToMore-Body_Master_Perk_5_-SavageSling-LvL1-Desc
  loc_name_key: ''
  pointsCost: 0
  uiData:
    $type: gamedataNewPerkLevelUIData_Record
    floatValues:
      - 20




