# need to modify Takedown interactions so their prompts actually show up

# should be the popup for the base finisher if savage sling is NOT avalible
Takedown.NewPerkFinisher:
  instigatorPrereqs:
    - Takedown.GameplayRestrictions
    - PerksApplyToMore.MeleeFinisherAvailiblePrereq
    - $type: gamedataPlayerIsNewPerkBoughtPrereq_Record
      invert: True
      level: 2
      perkType: Body_Master_Perk_5
      prereqClassName: PlayerIsNewPerkBoughtPrereq


# should be the popup for base finisher IF savage sling is avalilble
Takedown.NewPerkFinisherBlunt:
  instigatorPrereqs:
    - Takedown.GameplayRestrictions
    - PerksApplyToMore.MeleeFinisherAvailiblePrereq
    - PerksApplyToMore.NewSavageSlingFinisherUnlockedPrereq

# should be the popup for the savage sling finisher IF we have it
Takedown.NewPerkFinisherBluntHold:
  instigatorPrereqs:
    - Takedown.GameplayRestrictions
    - PerksApplyToMore.MeleeFinisherAvailiblePrereq
    - PerksApplyToMore.NewSavageSlingFinisherUnlockedPrereq

# new popup for savage sling if finisher aren't unlocked
PerksApplyToMore.NewSavageSlingFinisherTakedown:
  $type: gamedataObjectAction_Record
  actionName: NewPerkFinisherBluntHold #base: NewPerkFinisherBluntHold
  hackCategory: HackCategory.NotAHack
  interactionLayer: NewPerkFinisherLayer
  objectActionType: ObjectActionType.Direct
  objectActionUI: Interactions.NewSavageSlingFinisher
  priority: 0
  activationTime: []
  completionEffects: []
  costs: []
  durationTime: []
  instigatorActivePrereqs: []
  instigatorPrereqs:
    - Takedown.GameplayRestrictions
    - $type: gamedataMultiPrereq_Record
      aggregationType: OR
      prereqClassName: gameMultiPrereq
      nestedPrereqs:
        - $type: gamedataIPrereq_Record
          prereqClassName: ItemInSlotPrereq
          itemTag: MeleeWeapon
          checkType: CheckType.Tag
          attachmentSlot: AttachmentSlots.WeaponRight
          waitForVisuals: False
          inverted: True
        - $type: gamedataMultiPrereq_Record
          aggregationType: AND
          prereqClassName: gameMultiPrereq
          nestedPrereqs:
            - $type: gamedataStatPrereq_Record
              comparisonType: LessOrEqual
              notifyOnAnyChange: False
              notifyOnlyOnStateFulfilled: False
              objectToCheck: Owner
              statType: CanPerformBluntFinisher
              valueToCheck: 0
              prereqClassName: StatPrereq
              statModifiers: []
            - $type: gamedataStatPrereq_Record
              comparisonType: LessOrEqual
              notifyOnAnyChange: False
              notifyOnlyOnStateFulfilled: False
              objectToCheck: Owner
              statType: CanPerformCoolFinisher
              valueToCheck: 0
              prereqClassName: StatPrereq
              statModifiers: []
            - $type: gamedataStatPrereq_Record
              comparisonType: LessOrEqual
              notifyOnAnyChange: False
              notifyOnlyOnStateFulfilled: False
              objectToCheck: Owner
              statType: CanPerformMonowireFinisher
              valueToCheck: 0
              prereqClassName: StatPrereq
              statModifiers: []
            - $type: gamedataStatPrereq_Record
              comparisonType: LessOrEqual
              notifyOnAnyChange: False
              notifyOnlyOnStateFulfilled: False
              objectToCheck: Owner
              statType: CanPerformReflexFinisher
              valueToCheck: 0
              prereqClassName: StatPrereq
              statModifiers: []
    - PerksApplyToMore.NewSavageSlingFinisherUnlockedPrereq
  interruptionPrereqs: []
  rewards: []
  startEffects: []
  targetActivePrereqs: []
  targetPrereqs:
    - Takedown.IsTargetEnemy
    - Takedown.NewPerkFinisherBluntHold_inline0
    - Takedown.NewPerkFinisherBluntHold_inline1
    - Takedown.NewPerkFinisherBluntHold_inline2
    - Takedown.NewPerkFinisherBluntHold_inline3
    - Takedown.NewPerkFinisherBluntHold_inline4
    - Takedown.NewPerkFinisherBluntHold_inline5
    - Takedown.NewPerkFinisherBluntHold_inline6
    - Takedown.NewPerkFinisherBluntHold_inline7
    - Takedown.NewPerkFinisherBluntHold_inline8
    - Takedown.NewPerkFinisherBluntHold_inline13
    - Takedown.NewPerkFinisherBluntHold_inline18


#and we need the interaction to be isolated because the reds file needs to ID it individually
Interactions.NewSavageSlingFinisher:
  $type: gamedataInteractionMountBase_Record
  tag: mount
  action: Choice1
  captionIcon: ChoiceCaptionParts.TakeDownIcon
  name: NewPerkFinisherBluntHold
  prereqID: ''
  caption: LocKey#88003




#prereqs

#to make sure we don't get these twice. They would add up if I'm reading this correctly.

PerksApplyToMore.NotRegularFinisherAvaliblePrereq:
  $type: gamedataMultiPrereq_Record
  aggregationType: OR
  prereqClassName: gameMultiPrereq
  nestedPrereqs:
    - PerksApplyToMore.NotBluntWeaponHeldPrereq
    - PerksApplyToMore.NotRegularFinisherUnlockedPrereq

PerksApplyToMore.NotBluntWeaponHeldPrereq:
  $type: gamedataIPrereq_Record
  prereqClassName: ItemInSlotPrereq
  weaponEvolution: WeaponEvolution.Blunt
  attachmentSlot: AttachmentSlots.WeaponRight
  checkType: CheckType.Evolution
  inverted: True
  waitForVisuals: False



PerksApplyToMore.NotRegularFinisherUnlockedPrereq:
  $type: gamedataPlayerIsNewPerkBoughtPrereq_Record
  invert: True
  level: 2
  perkType: Reflexes_Right_Milestone_3
  prereqClassName: PlayerIsNewPerkBoughtPrereq


#used in Takedown interactions
PerksApplyToMore.NewSavageSlingFinisherUnlockedPrereq:
  $type: gamedataPlayerIsNewPerkBoughtPrereq_Record
  invert: False
  level: 2
  perkType: Body_Master_Perk_5
  prereqClassName: PlayerIsNewPerkBoughtPrereq


#used in Takedown interactions
PerksApplyToMore.MeleeFinisherAvailiblePrereq:
  $type: gamedataMultiPrereq_Record
  aggregationType: AND
  prereqClassName: gameMultiPrereq
  nestedPrereqs:
    - Prereqs.MeleeWeaponHeldPrereq
    - $type: gamedataMultiPrereq_Record
      aggregationType: OR
      prereqClassName: gameMultiPrereq
      nestedPrereqs:
        - Prereqs.CanPerformBluntFinisher
        - Prereqs.CanPerformCoolFinisher
        - Prereqs.CanPerformMonowireFinisher
        - Prereqs.CanPerformReflexFinisher


#and lastly the enemy needs to have the new custom interaction prompt
Character.Interactable_NPC_Base.objectActions:
  - !append PerksApplyToMore.NewSavageSlingFinisherTakedown
