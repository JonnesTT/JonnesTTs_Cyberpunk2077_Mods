BaseStatusEffect.Reflexes_Sharpshooter_Stamina_Stack_inline4.statModifiers:
  - !remove BaseStatusEffect.Reflexes_Sharpshooter_Stamina_Stack_inline7
  - !remove BaseStatusEffect.Reflexes_Sharpshooter_Stamina_Stack_inline8

